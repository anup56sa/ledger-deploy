name: CD Pipeline

on:
  push:
    paths:
      - 'envs/**'
    branches:
      - main
      
  workflow_dispatch:
    inputs:
      ECRURL:
        description: "ECR Registry URL (with / at end)"
        required: true
        default: "081654307023.dkr.ecr.ap-south-1.amazonaws.com/"
      REPO:
        description: "Repository Name"
        required: true
        default: "wezvatechledger"
      IMAGE:
        description: "Image Tag"
        required: true
        default: "rel28"
      TEST:
        description: "Environment"
        required: true
        type: choice
        options:
          - functional
          - integration
          - regression
          - uat
          - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Define environment variables with fallback values for the push trigger
    env:
      ENV_NAME: ${{ inputs.TEST || 'functional' }}
      ECR_URL: ${{ inputs.ECRURL || '081654307023.dkr.ecr.ap-south-1.amazonaws.com/' }}
      REPO_NAME: ${{ inputs.REPO || 'wezvatechledger' }}
      IMAGE_TAG: ${{ inputs.IMAGE || 'rel28' }}

    steps:
      # -----------------------------
      # Checkout Deployment Repo
      # -----------------------------
      - name: Checkout Deployment Repo
        uses: actions/checkout@v4
        with:
          repository: wezva-fintech/ledger-deployment
          ref: main
          token: ${{ secrets.GH_PAT }}

      # -----------------------------
      # Update values.yaml
      # -----------------------------
      - name: Update Helm values
        run: |
          cd envs/${{ env.ENV_NAME }}

          echo "Updating image repository..."
          sed -i "s|repository:.*|repository: ${{ env.ECR_URL }}${{ env.REPO_NAME }}|g" values.yaml

          echo "Updating image tag..."
          sed -i "s|tag:.*|tag: ${{ env.IMAGE_TAG }}|g" values.yaml

          echo "Updated values.yaml:"
          cat values.yaml

      # -----------------------------
      # Commit & Push Changes
      # -----------------------------
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add .
          git commit -m "New deployment for Build ${{ env.IMAGE_TAG }}" || echo "No changes to commit"

          git push origin main
