
global:
  tlsDisable: false

vault:
  injector:
    enabled: false

  server:
    enabled: true

    dataStorage:
      enabled: true
      size: 5Gi
      storageClass: standard
      accessMode: ReadWriteOnce

    volumes:
      - name: vault-tls
        secret:
          secretName: vault-tls

    volumeMounts:
      - name: vault-tls
        mountPath: /vault/userconfig/tls
        readOnly: true

    ha:
      enabled: true
      replicas: 3

      raft:
        enabled: true
        setNodeId: true

        config: |
          ui = true

          api_addr = "https://HOSTNAME.vault-internal:8200"
          cluster_addr = "https://HOSTNAME.vault-internal:8201"

          listener "tcp" {
            address         = "[::]:8200"
            cluster_address = "[::]:8201"

            tls_disable   = 0
            tls_cert_file = "/vault/userconfig/tls/tls.crt"
            tls_key_file  = "/vault/userconfig/tls/tls.key"
          }

          storage "raft" {
            path = "/vault/data"

            retry_join {
              leader_api_addr = "https://vault-0.vault-internal:8200"
              leader_tls_servername = "vault-internal.vault.svc"
              leader_ca_cert_file = "/vault/userconfig/tls/ca.crt"
            }

            retry_join {
              leader_api_addr = "https://vault-1.vault-internal:8200"
              leader_tls_servername = "vault-internal.vault.svc"
              leader_ca_cert_file = "/vault/userconfig/tls/ca.crt"
            }

            retry_join {
              leader_api_addr = "https://vault-2.vault-internal:8200"
              leader_tls_servername = "vault-internal.vault.svc"
              leader_ca_cert_file = "/vault/userconfig/tls/ca.crt"
            }
          }

          service_registration "kubernetes" {}

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi

    affinity: |
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: vault
                  app.kubernetes.io/instance: vault
                  component: server

  ui:
    enabled: true
    serviceType: ClusterIP

